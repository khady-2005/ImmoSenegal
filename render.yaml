# Plan de déploiement Render (« Blueprint »). Aucun secret ici : les valeurs sensibles sont saisies dans le tableau de bord Render.
services:
  - type: web
    name: immosenegal-api
    runtime: docker
    plan: free
    region: virginia                 # proche de la base Neon (AWS US East 1) : échanges rapides
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping       # sans accès à la base : n'empêche pas Neon de se mettre en veille
    # Déploiement automatique à chaque commit, uniquement si les vérifications GitHub (CI) sont au vert.
    autoDeployTrigger: checksPass
    envVars:
      - key: JWT_SECRET
        generateValue: true          # secret aléatoire créé par Render, jamais dans Git
      - key: DB_URL
        sync: false                  # jdbc:postgresql://... (fourni par Neon, à saisir dans Render)
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # adresse exacte du site (https://....vercel.app)
      - key: EXEMPLES_ACTIFS
        value: "false"              # aucune annonce fictive en production
      - key: FORWARD_HEADERS_STRATEGY
        value: native                # lit la vraie IP du client derrière le proxy Render
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: Strict                # le site appelle /api via Vercel (même origine), donc Strict convient
      # URL publique du frontend : utilisée dans les liens de réinitialisation du mot de passe.
      - key: FRONTEND_URL
        sync: false                  # ex. https://votre-site.vercel.app
      # Assistant IA : la clé est saisie uniquement dans le tableau de bord Render.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Configuration SMTP : nécessaire pour envoyer les liens de réinitialisation par e-mail.
      - key: MAIL_HOST
        sync: false                  # serveur SMTP du fournisseur de messagerie
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false                  # mot de passe ou clé SMTP, jamais dans Git
      - key: MAIL_FROM
        sync: false                  # adresse expéditrice autorisée par le fournisseur SMTP
      - key: PAYDUNYA_MASTER_KEY
        sync: false                  # clé principale privée : ne jamais la mettre dans Git
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false                  # clé privée : ne jamais la mettre dans Git
      - key: PAYDUNYA_PUBLIC_KEY
        sync: false                  # clé publique : ne jamais la mettre dans Git
      - key: PAYDUNYA_TOKEN
        sync: false                  # jeton API privé : ne jamais le mettre dans Git
      - key: PAYDUNYA_MODE
        value: test                  # production uniquement après activation du compte marchand
      - key: PAYDUNYA_CALLBACK_URL
        sync: false                  # URL Render publique + /api/abonnements/paydunya/callback
